dagster-user-deployments:
  enabled: true
  deployments:
    - name: "dag-user-deploy"
      image:
        repository: ${repository}
        tag: "latest"
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "--python-module"
        - "test_project.dagster.test_project.test_project"
      port: 3030

dagsterWebserver:
  pathPrefix: "/dagster"
  readinessProbe:
    httpGet:
      path: "/dagster/server_info"